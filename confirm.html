<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Confirm the cash count</title>
<!-- Pizza 99 OS — the AM cashier confirms the morning run's cash count on their own phone (migration 018, 2026-11-05).
     No login: the one-time code in the link is the key. Reads get_walk_confirm, writes confirm_walk_run; nothing else. -->
<style>
  :root { --bg:#F7F8FA; --card:#FFFFFF; --ink:#14213D; --mut:#5B6475; --line:#DCE2EA; --ok:#067647; --okbg:#ECFDF3; --bad:#B42318; --badbg:#FEF3F2; --brand:#2A78D6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F1626; --card:#18223A; --ink:#EEF1F6; --mut:#A3AEC2; --line:#2B3A5C; --okbg:#0B2E1E; --badbg:#3A1512; --ok:#47CD89; --bad:#F97066; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  .brand { font-weight:600; color:var(--brand); font-size:14px; letter-spacing:.04em; text-transform:uppercase }
  h1 { font-size:24px; line-height:1.2; margin:6px 0 4px }
  .mut { color:var(--mut) } .small { font-size:14px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:14px }
  .big { display:grid; grid-template-columns:repeat(3,1fr); gap:8px }
  .big div { display:grid } .big span { font-size:13px; color:var(--mut) } .big b { font-size:20px; font-variant-numeric:tabular-nums }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums }
  td { padding:6px 0; border-bottom:1px solid var(--line) } td:last-child, td:nth-child(2) { text-align:right }
  button { font:inherit; font-weight:600; width:100%; min-height:52px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); margin-top:10px; cursor:pointer }
  button.yes { background:var(--ok); border-color:var(--ok); color:#fff }
  button:disabled { opacity:.5 }
  textarea { width:100%; min-height:80px; font:inherit; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--card); color:var(--ink); margin-top:8px }
  .ok { background:var(--okbg); color:var(--ok) } .bad { background:var(--badbg); color:var(--bad) }
  .note { border-radius:10px; padding:12px; margin-top:14px; font-weight:600 }
</style>
</head>
<body>
<main id="app"><div class="brand">Rocket OS · Morning run</div><p class="mut">Loading…</p></main>
<script>
const DB_URL = "https://fuvtcwalsmgufbkozxul.supabase.co", DB_KEY = "sb_publishable_n_au6M6ZgAC38s85asticA_s5Ux-jkF";
const TOK = new URLSearchParams(location.search).get("t") || "";
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const peso = n => "₱" + Number(n || 0).toLocaleString("en-PH", { maximumFractionDigits: 2 });
const day = d => new Date(d + "T00:00:00").toLocaleDateString("en-PH", { weekday: "long", day: "numeric", month: "long" });
const time = t => new Date(t).toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" });
async function rpc(name, args) {
  const r = await fetch(`${DB_URL}/rest/v1/rpc/${name}`, { method: "POST", headers: { apikey: DB_KEY, Authorization: `Bearer ${DB_KEY}`, "Content-Type": "application/json" }, body: JSON.stringify(args) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || `Error ${r.status}`);
  return j;
}
const head = `<div class="brand">Rocket OS · Morning run</div>`;
function stop(title, text) { app.innerHTML = `${head}<h1>${esc(title)}</h1><p class="mut">${esc(text)}</p>`; }
let D = null;
function draw(msg) {
  const rows = [1000, 500, 200, 100, 50, 20, 10, 5, 1].map(d => [d, +((D.cash || {})[d] || 0)]).filter(r => r[1] > 0)
    .map(([d, n]) => `<tr><td>₱${d.toLocaleString("en-PH")}</td><td>× ${n}</td><td>${peso(d * n)}</td></tr>`).join("");
  const done = D.confirmed_at
    ? `<div class="note ${D.confirm_ok ? "ok" : "bad"}">${D.confirm_ok ? "✓ Confirmed as correct" : "✗ Marked as not correct"} at ${esc(time(D.confirmed_at))}.${D.confirm_note ? `<br><span class="small">“${esc(D.confirm_note)}”</span>` : ""}</div>`
    : `<div class="card"><b>${esc(D.cashier || "Cashier")}: did you count this money together, and is it correct?</b>
        <button class="yes" id="yes" onclick="send(true)">Yes, correct. I counted it together.</button>
        <button id="no" onclick="document.getElementById('nobox').hidden=false;this.hidden=true">No, something is not correct</button>
        <div id="nobox" hidden><textarea id="why" placeholder="What is not correct? Example: we counted ₱500 less."></textarea><button onclick="send(false)">Send: not correct</button></div>
        ${msg ? `<div class="note bad small">${esc(msg)}</div>` : ""}</div>`;
  app.innerHTML = `${head}<h1>${esc(D.store)}</h1><div class="mut">${esc(day(D.day))}</div>
    <div class="card big"><div><span>Drawer</span><b>${peso(D.cash_total)}</b></div><div><span>Fund kept</span><b>${peso(D.fund)}</b></div><div><span>Cash sales</span><b>${peso(D.cash_sales)}</b></div></div>
    <div class="card"><table>${rows || `<tr><td class="mut">No notes or coins recorded</td></tr>`}<tr><td><b>Total</b></td><td></td><td><b>${peso(D.cash_total)}</b></td></tr></table></div>${done}`;
}
async function send(ok) {
  const why = ok ? null : (document.getElementById("why").value || "").trim();
  if (!ok && !why) return draw("Write what is not correct.");
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  try { await rpc("confirm_walk_run", { p_token: TOK, p_ok: ok, p_note: why }); D = await rpc("get_walk_confirm", { p_token: TOK }); draw(); }
  catch (e) { draw(e.message); }
}
(async () => {
  if (!/^[0-9a-f]{32}$/.test(TOK)) return stop("This link is not complete", "Scan the QR code on the tablet again.");
  try { D = await rpc("get_walk_confirm", { p_token: TOK }); }
  catch (e) { return stop("No connection", "Check your internet and open the link again."); }
  if (!D || !D.ok) return stop(D && D.reason === "expired" ? "This code has expired" : "This code is not valid", "Ask for a new code on the tablet.");
  draw();
})();
</script>
</body>
</html>
